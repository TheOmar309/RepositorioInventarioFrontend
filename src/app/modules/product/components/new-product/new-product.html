<h2 mat-dialog-title>{{tituloFormulario}} Producto</h2>

<mat-dialog-content>
  <form [formGroup]="productForm">
    <div style="display: flex; flex-direction: column; padding: 10px 0;">

      <!-- Botón para subir Foto (Diseño Material) -->
      <div style="margin-bottom: 20px; display: flex; align-items: center;">
        <button mat-stroked-button color="primary" type="button" (click)="fileInput.click()">
          <mat-icon>image</mat-icon> Seleccionar Foto
        </button>
        <!-- Input real oculto -->
        <input hidden (change)="onFileSelected($event)" #fileInput type="file" accept="image/*">
        <!-- Mostramos el nombre de la foto elegida -->
        <span style="margin-left: 10px; color: gray;">{{ imageName || 'Ningún archivo seleccionado' }}</span>
      </div>

      <!-- Nombre -->
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Nombre del Producto</mat-label>
        <input matInput formControlName="name" required>
      </mat-form-field>

      <!-- Precio -->
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" required>
      </mat-form-field>

      <!-- Cantidad (Account) -->
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Cantidad en Stock</mat-label>
        <input matInput type="number" formControlName="account" required>
      </mat-form-field>

      <!-- Categoría -->
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="category" required>
          <mat-option *ngFor="let cat of categories" [value]="cat.id">
            {{cat.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="onCancel()">Cancelar</button>
  <!-- El botón de guardar se desactiva si falta llenar algo o falta la foto -->
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="productForm.invalid || (!selectedFile && !data)">
     <mat-icon>save</mat-icon> Guardar
   </button>
</mat-dialog-actions>
