<div style="padding: 20px;">

  <!-- Encabezado con el Título y el Botón -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2 style="margin: 0;">Listado de Productos</h2>
    <button mat-raised-button color="primary" (click)="openProductDialog()">
      <mat-icon>add_circle</mat-icon> Nuevo Producto
    </button>
  </div>

  <!-- Buscador adaptado al nuevo diseño -->
  <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 10px;">
    <mat-label>Buscar Productos</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Laptop Huawei..." #input>
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="mat-elevation-z8">

    <table mat-table [dataSource]="dataSource" style="width: 100%;">

      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Columna Imagen -->
      <ng-container matColumnDef="picture">
        <th mat-header-cell *matHeaderCellDef> Imagen </th>
        <td mat-cell *matCellDef="let element">
          <!-- Magia para renderizar la imagen en Base64 -->
          <img *ngIf="element.picture" [src]="'data:image/jpeg;base64,' + element.picture"
               width="60" height="60" style="border-radius: 5px; margin: 5px 0; object-fit: cover;" alt="product_image">
        </td>
      </ng-container>

      <!-- Columna Nombre -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- Columna Precio -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let element"> ${{element.price}} </td>
      </ng-container>

      <!-- Columna Cantidad -->
      <ng-container matColumnDef="account">
        <th mat-header-cell *matHeaderCellDef> Cantidad </th>
        <td mat-cell *matCellDef="let element"> {{element.account}} </td>
      </ng-container>

      <!-- Columna Categoría -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Categoría </th>
        <!-- Accedemos al nombre de la categoría anidada -->
        <td mat-cell *matCellDef="let element"> {{element.category.name}} </td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <!-- Le pasamos el 'element' (el producto de esa fila) a la función -->
          <button mat-button color="primary" (click)="editProduct(element)">Editar</button>
          <button mat-button color="warn" (click)="deleteProduct(element)">Eliminar</button>
        </td>
      </ng-container>

      <!-- Renderizado de las filas de la tabla -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Paginador de Material -->
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Seleccionar página de productos">
    </mat-paginator>

  </div>
</div>
