<div class="dashboard-container" style="display: flex; flex-direction: column; position: absolute; top: 0; bottom: 0; left: 0; right: 0;">

  <!-- Empieza Toolbar -->
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="snav.toggle()"><mat-icon>menu</mat-icon></button>
    <h1 class="app-name">Inventory</h1>

    <!-- Este span empuja los botones de la derecha hasta la orilla -->
    <span style="flex: 1 1 auto;"></span>

    <div class="right">
        <!-- Quitamos los viñetas de la lista y los alineamos rectos -->
        <ul style="list-style: none; display: flex; margin: 0; padding: 0; align-items: center;">
          <li>
            <!-- Botón de Ayuda conectado -->
            <button mat-icon-button (click)="showHelp()">
              <mat-icon>help_outline</mat-icon>
            </button>
          </li>
          <li>
            <!-- Botón de Usuario con menú desplegable -->
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>person_outline</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <!-- Botón de Cerrar sesión conectado -->
              <button mat-menu-item (click)="logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Cerrar Sesión</span>
              </button>
            </mat-menu>
          </li>
        </ul>
    </div>
  </mat-toolbar>

  <!-- Empieza Sidenav -->
  <mat-sidenav-container class="sidenav-container" style="flex: 1;" [style.marginTop.px]="mobileQuery.matches ? 56 : 0">

    <mat-sidenav #snav [mode]="mobileQuery.matches ? 'over' : 'side'" [fixedInViewport]="mobileQuery.matches" [opened]="!mobileQuery.matches">
      <mat-nav-list>

        <!-- Profile Card -->
        <div class="profile-card" style="padding: 20px 15px; text-align: left;">
          <div class="header">
            <h2 style="margin: 0; font-size: 18px;">Omar Lopez Ciriaco</h2>
            <h4 style="margin: 0; font-size: 13px; color: gray; font-weight: normal;">lopezciriacoomar2@gmail.com</h4>
          </div>
        </div>
        <mat-divider></mat-divider>

        <!-- Menú de Navegación con Iconos Alineados -->
        <a mat-list-item [routerLink]="nav.route" *ngFor="let nav of menuNav" routerLinkActive="active-link">
          <div style="display: flex; align-items: center; padding: 0 10px;">
            <mat-icon style="margin-right: 15px; color: #555;">{{nav.icon}}</mat-icon>
            <span>{{nav.name}}</span>
          </div>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <!-- Contenedor Principal (Aquí cargan Productos, Categorías y Home) -->
    <mat-sidenav-content style="height: 100%; overflow: auto;">
        <!-- El padding da un respiro visual para que no pegue a los bordes -->
        <div style="padding: 20px;">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
