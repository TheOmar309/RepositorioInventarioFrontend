<div style="padding: 20px;">

  <!-- Encabezado igual a Productos (Título a la izquierda, Botón a la derecha) -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2 style="margin: 0;">Listado de Categorías</h2>
    <button mat-raised-button color="primary" (click)="openCategoryDialog()">
      <mat-icon>add_circle</mat-icon> Agregar Categoría
    </button>
  </div>

  <!-- Buscador adaptado al nuevo diseño -->
  <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 10px;">
    <mat-label>Buscar Categorías</mat-label>
    <!-- Agregamos el (keyup) aquí -->
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Tecnología..." #input>
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Contenedor con la misma sombra (elevation) que Productos -->
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" style="width: 100%;">

      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> No </th>
        <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
      </ng-container>

      <!-- Columna Nombre -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
      </ng-container>

      <!-- Columna Descripción -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let element"> {{ element.description }} </td>
      </ng-container>

      <!-- Columna Acciones (Usando los mismos botones de texto que Productos) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-button color="primary" (click)="editCategory(element)">Editar</button>
          <button mat-button color="warn" (click)="deleteCategory(element)">Eliminar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
    </table>
  </div>
</div>
